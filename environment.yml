# PHYS 0241 Biomedical Imaging notebooks: conda environment.
# Create with:   conda env create -f environment.yml
# Activate with: conda activate phys0241
# Then run:      jupyter lab
name: phys0241
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=2.0
  - scipy>=1.12
  - matplotlib>=3.9
  - ipympl>=0.9.4
  - ipywidgets>=8.1
  - scikit-image>=0.24
  - plotly>=5.24
  - pillow>=10
  - imageio>=2.34
  - jupyterlab>=4.2
  - ipykernel>=6.29
